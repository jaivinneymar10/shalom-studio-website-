<style>
:root{--gold:#c9a84c;--gl:#e8c97a;--gp:#f5e9c8;--dark:#1a1208;--dark2:#2b1f0a;--cream:#fdf8ef;--ww:#fffdf8;--text:#3a2c10;--soft:#7a6540;--bd:#e0cfa0;--serif:'Playfair Display',Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

@keyframes fu2{from{transform:translateY(24px)}}.hero>div>*{animation:fu2 .5s cubic-bezier(.2,.7,.2,1) both}.hero>div>:nth-child(2){animation-delay:0s}.hero>div>:nth-child(3){animation-delay:0s}.hero>div>:nth-child(n+4){animation-delay:.1s}

.btn{position:relative;overflow:hidden}.btn::after{content:'';position:absolute;top:0;left:-130%;width:55%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shn 3.6s infinite}
@keyframes shn{0%,55%{left:-130%}100%{left:180%}}
.rv{opacity:0;transform:translate(var(--tx,0),36px) scale(.98);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1),background .3s}

.card{cursor:pointer}.card:hover{box-shadow:0 18px 40px rgba(60,40,10,.18);z-index:2}.card img{transition:transform .5s ease}.card::after{content:'Quick view';position:absolute;top:12px;right:12px;background:rgba(26,18,8,.8);color:var(--gl);font-size:.7rem;padding:4px 10px;letter-spacing:.1em;opacity:0;transition:.3s}.card:hover::after{opacity:1}

.wa{animation:wp 2.4s infinite}@keyframes wp{0%{box-shadow:0 0 0 0 rgba(37,211,102,.55)}100%{box-shadow:0 0 0 22px rgba(37,211,102,0)}}
.stat b{font-variant-numeric:tabular-nums}.steps i{transition:.4s}.steps>div:hover i{background:var(--gold);color:var(--dark);transform:rotate(360deg) scale(1.08)}

.studio{background:linear-gradient(160deg,var(--dark),var(--dark2));color:var(--cream)}.studio .t{color:var(--cream)}.studio .d{color:rgba(253,248,239,.6)}

.qv img{width:100%;height:100%;min-height:260px;object-fit:cover}.qv>div{padding:2rem}.qv h3{font:700 1.5rem var(--serif);margin-bottom:.6rem}.qv p{color:var(--soft);margin-bottom:1rem;line-height:1.7}.qv ul{list-style:none;margin-bottom:1rem}.qv li{font-size:.88rem;padding:3px 0}.qv li::before{content:'✦ ';color:var(--gold)}

.glow{transition:opacity .3s}

/* Image upload: uses Claude assets when hosted there, otherwise resizes the photo and embeds it */
async function uploadImg(f){
  try{ if(ASSETS) return (await ASSETS.upload(f)).url; }catch(x){alert("Upload failed: "+(x.message||x.code||""));return null;}
  return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(f);
    im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.85));};
    im.onerror=()=>{alert("Could not read that image");res(null);};im.src=u;});}

/* ---- admin password gate (hash only is stored here, never the password) ---- */
const ADMIN_SALT="shalom-studio-v1",ADMIN_HASH="871e4b79f1ec39353b4831d92b27e0d4c942cdfccebef2be6ddf42fd6caa5417";let ADMIN_OK=false,ADMIN_FAILS=0;
async function sha256hex(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
function adminLock(a){
  a.classList.add("open");
  a.innerHTML=`<header>Shalom Admin</header><div class="body" style="text-align:center;padding-top:4rem;max-width:360px;margin:0 auto"><h2 style="font-family:var(--serif)">🔒 Admin login</h2><p style="margin:1rem 0;color:#666">Enter the admin password to continue.</p><input type="password" id="apw" placeholder="Password" autocomplete="current-password" style="width:100%;padding:.7rem;margin-bottom:.8rem"><button class="a" id="alg" style="width:100%">Unlock</button><p id="aerr" style="color:#b00020;margin-top:.8rem;min-height:1.2em"></p><button class="a" id="vs" style="margin-top:1rem;opacity:.7">← Back to site</button></div>`;
  const inp=$("#apw"),err=$("#aerr"),btn=$("#alg");inp.focus();

  const go=async()=>{
    if(!window.crypto||!crypto.subtle){err.textContent="Open this site over https to use admin.";return;}
    btn.disabled=true;
    const ok=(await sha256hex(ADMIN_SALT+inp.value))===ADMIN_HASH;
    if(ok){ADMIN_OK=true;ADMIN_FAILS=0;openAdmin();window.scrollTo(0,0);return;}
    ADMIN_FAILS++;err.textContent="Wrong password.";inp.value="";
    const wait=Math.min(30,ADMIN_FAILS*3);let t=wait;btn.textContent="Wait "+t+"s";
    const iv=setInterval(()=>{t--;if(t<=0){clearInterval(iv);btn.disabled=false;btn.textContent="Unlock";inp.focus();}else btn.textContent="Wait "+t+"s";},1000);
  };
  btn.onclick=go;inp.onkeydown=e=>{if(e.key==="Enter"&&!btn.disabled)go();};

  rvlist();$("#addr").onclick=()=>{CFG.reviews.push(["",""]);rvlist();};
  glist();
  $("#upGal").onchange=async e=>{for(const f of e.target.files){const u=await upl(f);if(u)CFG.gallery.push({img:u,label:f.name.replace(/\.[^.]+$/,"").slice(0,24)});}glist();e.target.value="";};
  $("#upAbout").onchange=async e=>{const u=e.target.files[0]&&await upl(e.target.files[0]);if(u){CFG.about.img=u;$("#msg").textContent="About photo set — click Save & Publish";}};
  const msg=t=>{$("#msg").textContent=t;};
  const TABS=[["Banner & Hero",["Offer banner","Hero","Hero side photos"]],["Brand & About",["Brand","About text","How it works"]],["Offers",["Offers section"]],["Reviews",["Reviews"]],["Products",["Products & offers"]],["Photos",["About photo","Gallery photos"]],["Contact",["Contact & store","Legal pages","Analytics"]]];
  const fsets=[...a.querySelectorAll(".body>fieldset")];
  const showTab=i=>{fsets.forEach(f=>{f.style.display=TABS[i][1].includes(f.querySelector("legend").textContent)?"":"none";});$("#tabs").querySelectorAll("button").forEach((b,j)=>b.classList.toggle("on",j===i));};
  $("#tabs").innerHTML=TABS.map((t,i)=>`<button data-t="${i}">${t[0]}</button>`).join("");$("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>showTab(+b.dataset.t));showTab(0);
  if(!IS_ADMIN)msg("View-only: open as the page owner to publish changes.");
  const leave=e=>{if(e)e.preventDefault();if(document.body.classList.contains("adminpage"))location.hash="";else{a.classList.remove("open");render();}};$("#x").onclick=()=>leave();$("#vs").onclick=leave;
  $("#addp").onclick=()=>{CFG.products.push({id:"p"+Date.now(),name:"New Product",price:100,unit:"piece",discount:0,badge:"",show:true,img:"",desc:"",features:[]});plist();};
  $("#sv").onclick=async()=>{msg("Saving…");msg(await save());render();};
  $("#rs").onclick=()=>{if(confirm("Reset everything to defaults?")){CFG=structuredClone(DEFAULTS);openAdmin();}};
  $("#ex").onclick=()=>{const blob=new Blob([JSON.stringify(CFG,null,2)],{type:"application/json"});const u=URL.createObjectURL(blob);const l=document.createElement("a");l.href=u;l.download="site-data.json";l.click();URL.revokeObjectURL(u);msg("Downloaded site-data.json. Upload it next to index.html on your host to publish.");};
  $("#im").onchange=async e=>{try{CFG=merge(DEFAULTS,JSON.parse(await e.target.files[0].text()));openAdmin();msg("Imported — click Save");}catch(x){msg("Invalid file");}};
}

loadStored();initCloud();
mountAdmin();

</script>
</body>
</html>
